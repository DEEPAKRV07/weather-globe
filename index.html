<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Globe</title>
    <!-- Core React Engine Libraries -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .app-box {
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 90%;
        max-width: 400px;
      }
      input {
        padding: 12px 15px;
        width: 60%;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
        color: #333;
      }
      button {
        padding: 12px 20px;
        margin-left: 10px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(90deg, #4facfe, #00f2fe);
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
      }
      .card {
        margin-top: 30px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [city, setCity] = React.useState("");
        const [weather, setWeather] = React.useState(null);

        // Working fallback demo key to verify instant runtime activation
        const API_KEY = "85c54d193f4469733057e96b864a7872"; 

        const searchPressed = () => {
          if (!city.trim()) return;
          fetch(`https://openweathermap.org{encodeURIComponent(city)}&units=metric&appid=${API_KEY}`)
            .then((res) => res.json())
            .then((data) => {
              if (data.cod === 200 || data.cod === "200") {
                setWeather(data);
              } else {
                alert(data.message || "City name not found.");
              }
            })
            .catch((err) => alert("Network request timed out. Please try again."));
        };

        return (
          <div className="app-box">
            <h2>🌍 Weather Globe</h2>
            <div>
              <input 
                type="text" 
                placeholder="Search city..." 
                value={city}
                onChange={(e) => setCity(e.target.value)} 
                onKeyPress={(e) => e.key === 'Enter' && searchPressed()}
              />
              <button onClick={searchPressed}>Search</button>
            </div>

            {weather && weather.weather && weather.weather[0] && (
              <div className="card">
                <h3>{weather.name}, {weather.sys?.country}</h3>
                <h1>{Math.round(weather.main?.temp)}°C</h1>
                <p style={{ textTransform: 'capitalize' }}>{weather.weather[0].description}</p>
                <p>💧 Humidity: {weather.main?.humidity}%</p>
                <p>💨 Wind Speed: {weather.wind?.speed} m/s</p>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
