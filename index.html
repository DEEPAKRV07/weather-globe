<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Globe</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-box {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 400px;
    }
    .input-container {
      display: flex;
      margin-top: 20px;
      justify-content: center;
    }
    input {
      padding: 12px 15px;
      width: 60%;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
      color: #333;
    }
    button {
      padding: 12px 20px;
      margin-left: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .card {
      margin-top: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: none;
    }
    h2 { margin: 0 0 10px 0; }
  </style>
</head>
<body>

  <div class="app-box">
    <h2>🌍 Weather Globe</h2>
    <div class="input-container">
      <input type="text" id="cityInput" placeholder="Search city..." onkeypress="handleKeyPress(event)">
      <button onclick="searchPressed()">Search</button>
    </div>

    <div id="weatherCard" class="card">
      <h3 id="cityName">---</h3>
      <h1 id="tempDisplay">--°C</h1>
      <p id="descDisplay" style="text-transform: capitalize;">---</p>
      <p id="humidityDisplay">💧 Humidity: --%</p>
      <p id="windDisplay">💨 Wind Speed: -- m/s</p>
    </div>
  </div>

  <script>
    const API_KEY = "85c54d193f4469733057e96b864a7872"; 

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        searchPressed();
      }
    }

    function searchPressed() {
      const city = document.getElementById("cityInput").value.trim();
      if (!city) return;

      fetch(`https://openweathermap.org{encodeURIComponent(city)}&units=metric&appid=${API_KEY}`)
        .then((res) => res.json())
        .then((data) => {
          if (data.cod === 200 || data.cod === "200") {
            document.getElementById("cityName").innerText = `${data.name}, ${data.sys?.country || ''}`;
            document.getElementById("tempDisplay").innerText = `${Math.round(data.main?.temp)}°C`;
            document.getElementById("descDisplay").innerText = data.weather[0]?.description || '';
            document.getElementById("humidityDisplay").innerText = `💧 Humidity: ${data.main?.humidity}%`;
            document.getElementById("windDisplay").innerText = `💨 Wind Speed: ${data.wind?.speed} m/s`;
            document.getElementById("weatherCard").style.display = "block";
          } else {
            alert(data.message || "City name not found.");
          }
        })
        .catch((err) => alert("Network request timed out. Please try again."));
    }
  </script>
</body>
</html>
